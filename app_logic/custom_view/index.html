<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile Inspection | Custom View</title>
    <!-- Brand font, colour tokens and background from the standard app. -->
    <link rel="stylesheet" href="/static/css/app.css">
    <style>
        body {
            justify-content: flex-start;
            padding: 24px 16px;
        }
        .view {
            width: min(100%, 1200px);
            display: grid;
            gap: 16px;
        }
        .view-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .view-header h1 {
            margin: 0;
            font-size: 1.25em;
            color: var(--color-accent);
            letter-spacing: 0.01em;
        }
        .view-sub {
            color: var(--color-muted);
            font-size: 0.85em;
            margin-top: 4px;
        }
        .badges {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .badge {
            min-width: 150px;
            padding: 10px 14px;
            border-radius: var(--radius-control);
            border: 1px solid var(--color-border);
            background: var(--color-panel);
        }
        .badge-label {
            font-size: 0.7em;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--color-muted);
        }
        .badge-value {
            font-size: 1.35em;
            font-weight: 800;
            margin-top: 2px;
        }
        .badge-detail {
            font-size: 0.8em;
            color: var(--color-muted);
        }
        .badge.ok { border-color: var(--color-accent-2); }
        .badge.ok .badge-value { color: var(--color-accent); }
        .badge.ng { border-color: var(--color-red); }
        .badge.ng .badge-value { color: var(--color-red); }
        .banner {
            padding: 10px 14px;
            border: 1px solid var(--color-red);
            border-radius: var(--radius-control);
            color: var(--color-red);
            background: rgba(255, 90, 107, 0.08);
            font-size: 0.9em;
        }
        .grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 16px;
        }
        @media (max-width: 900px) {
            .grid { grid-template-columns: minmax(0, 1fr); }
        }
        .card {
            background: var(--color-panel);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 14px 16px 16px;
            min-width: 0;
        }
        .card-title {
            font-size: 0.75em;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--color-accent-soft);
            margin-bottom: 10px;
        }
        .card-title span {
            color: var(--color-muted);
            font-weight: 600;
            letter-spacing: 0.02em;
            text-transform: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 220px;
        }
        canvas.short { height: 150px; }
        .events {
            list-style: none;
            margin: 0;
            padding: 0;
            font-size: 0.85em;
            font-variant-numeric: tabular-nums;
        }
        .events li {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 5px 0;
            border-bottom: 1px solid var(--color-border);
        }
        .events li:last-child { border-bottom: none; }
        .events .t { color: var(--color-muted); }
        .empty { color: var(--color-muted); font-size: 0.9em; }
    </style>
</head>
<body>
    <main class="view">
        <header class="view-header">
            <div>
                <h1>Profile inspection</h1>
                <div class="view-sub" id="view-status">Connecting…</div>
            </div>
            <div class="badges">
                <div class="badge" id="badge-profile">
                    <div class="badge-label">Height profile</div>
                    <div class="badge-value">—</div>
                    <div class="badge-detail">no cycle yet</div>
                </div>
                <div class="badge" id="badge-camera">
                    <div class="badge-label">Camera inspection</div>
                    <div class="badge-value">—</div>
                    <div class="badge-detail">no cycle yet</div>
                </div>
            </div>
        </header>

        <div class="banner" id="setup-error" hidden></div>

        <div class="grid">
            <section class="card">
                <div class="card-title">Robot X <span>— current cycle, mm</span></div>
                <canvas id="chart-x" class="short"></canvas>
                <div class="card-title" style="margin-top: 14px;">Height sensor <span>— current cycle, mm</span></div>
                <canvas id="chart-height" class="short"></canvas>
            </section>

            <section class="card">
                <div class="card-title">Height vs robot X <span id="profile-caption">— waiting for a complete cycle</span></div>
                <canvas id="chart-profile"></canvas>
            </section>
        </div>

        <section class="card">
            <div class="card-title">Events <span>— latest first</span></div>
            <ul class="events" id="events"><li class="empty">No events yet.</li></ul>
        </section>
    </main>

    <script src="/static/js/datahub.js"></script>
    <script src="view.js"></script>
</body>
</html>
