version: 1
settings:
  storage_scope: memory
  auto_persist: true
  default_reset_events: none
params:
  cycle_wait_s:
    type: float
    default: 1.0
    value: 1.0
    editable_when_idle: true
    description: Delay applied in demo prod cycle.
variables:
  part_count:
    type: int
    default: 0
    value: 0
    editable_when_idle: false
    reset_on: prod_start
    description: Parts processed since production start.
