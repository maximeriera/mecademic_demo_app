# Example workspace: computer-vision analysis on a GigE camera.
#
#   python app.py --workspace examples/gige_cv_analysis
#
# `camera` is software-triggered: it exposes a frame only when asked. The
# `vision` device asks for one at its rate_hz (each capture fires
# TriggerSoftware), runs blob_analysis.analyze() on it, and keeps the last raw
# image, processed image and result. Press INITIALIZE, then:
# * Settings > Devices, `vision`, "Show live data": raw and processed
#   thumbnails, the measurements, and the analysis_running switch that starts
#   and stops it;
# * Custom view: both feeds side by side with the latest result;
# * Manual tab, "Inspect once"; START PROD logs one inspection per cycle.

title: "GigE camera CV analysis"

devices:

  # --- Mecademic Robot (MecaRobot) ---
  robot:
    type: "mecademic"
    ip_address: "192.168.0.100"     # IP address of the robot controller

  gripper:
    type: "percipio_tulip"       # aliases: "tulip_gripper", "tulip"
    ip_address: "192.168.0.102"    # factory default; the PC must be on 200.0.0.x
    port: 2000                   # optional, default: 2000
    # serial_port: "COM4"          # instead of ip_address — USB-C virtual COM port
    # baudrate: 115200             # optional, default: 115200 (serial only)
    timeout: 2.0                 # optional, seconds — per reply
    travel_time_s: 0.05          # optional — full open/close duration, set at
                                #   Initialize when different (saved to the driver's flash)
    open_position: 100           # optional, default: 100 — % used by release()
    close_position: 0            # optional, default: 0 — % used by grip()

  camera:
    type: "gige_camera"
    cti_path: "/opt/spinnaker/lib/spinnaker-gentl/Spinnaker_GenTL.cti"
    camera_index: 0              # first camera the GenTL producer finds
    autostart_stream: true
    # features:                    # GenICam names of your camera, written in this order
    #   ExposureAuto: "Off"        # before ExposureTime: an auto mode overrides it
    #   ExposureTime: 20000.0      # µs
    #   Gain: 0.0                  # dB
    # Or, to tune them from Settings > Devices > camera > Features... and Save:
    features_file: "camera_features.yaml"
    trigger: "software"            # one frame per TriggerSoftware, fired by `vision` at its rate_hz
  #                                # (off: free-run; hardware: on a pulse of trigger_source)

  # No camera at hand? Replace the entry above with this one: a moving test
  # pattern with a green ball, which blob_analysis finds with the "test
  # pattern" params under `vision` (the laser-spot ones find nothing useful).
  # camera:
  #   type: "simulated_camera"
  #   trigger: "software"                        # as the GigE camera: a frame when `vision` asks...
  #   fps: 30                                    # ...up to the sensor's 30 fps: rate_hz sets the pace
  #   # features:
  #   #   ExposureTime: 4000         # µs (default 10000): too dark for threshold 175
  #   # features_file: "camera_features.yaml"   # instead of features:, to Save from the UI

  # vision:
  #   type: "cv_process"
  #   camera: "camera"                     # the device above: brought up first, down last
  #   analysis: "blob_analysis:analyze"    # module:function, importable from this folder
  #   analysis_params:                     # handed to analyze() as `params`; all listed in blob_analysis.py
  #     # A dim laser spot: a red disc with diffraction rings on a dark background.
  #     channel: "red"                     # luma, red, green, blue or max
  #     blur_px: 4                         # smooths the rings and the noise, pixels
  #     threshold: "20%"                   # 20% of the way from the background to the spot's peak:
  #                                        # low enough to keep a dimmer side of the disc
  #     fill_holes: true                   # the dark rings and dust inside count as spot
  #     min_area: 2000                     # pixels
  #     stretch: true                      # brighten the dim frame in the processed view only
  #     # The simulated camera's test pattern instead (green ball, bright background gradient):
  #     # threshold: 175                   # 0-255, "auto" (Otsu) or "N%"
  #     # min_area: 500
  #   autostart: true                      # trigger and analyse from INITIALIZE on. Stopped (Settings >
  #                                        # Devices), "Inspect once" triggers one frame itself
  #   rate_hz: 10                          # the trigger rate: one TriggerSoftware, then its analysis, at
  #                                        # most 10 times a second. A cycle is the exposure, the transfer
  #                                        # and ~70 ms of analysis per 1.3 Mpx frame: a longer one lowers it
  #   fault_on_error: false                # true: an exception in analyze() faults the cell

  vision:
    type: "cv_process"
    camera: "camera"                     # the device above: brought up first, down last
    analysis: "beam_analysis:analyze"    # module:function, importable from this folder
    analysis_params:
      channel: red            # the colour of your laser
      pixel_size_um: 3.45
      area_width: 0.60         # leave out the lens-clipped edges
      area_height: 0.60
      area_center_x: 0.52
      detect_snr: 20
      edge_k: 5
      display: enhanced
      targets_enabled: true
      target_min_radius_um: 140
      target_max_radius_um: 300
      show_text: false     # true to show the measurement text
      axes: true
      axis_unit: mm
    autostart: true                      # trigger and analyse from INITIALIZE on. Stopped (Settings >
                                         # Devices), "Inspect once" triggers one frame itself
    rate_hz: 10                          # the trigger rate: one TriggerSoftware, then its analysis, at
                                         # most 10 times a second. A cycle is the exposure, the transfer
                                         # and ~70 ms of analysis per 1.3 Mpx frame: a longer one lowers it
    fault_on_error: false    

manual_actions:
  - key: "inspect_once"
    label: "Inspect once"
    description: "Analyse the next triggered frame and log the result."
    confirm_title: "Inspect once"
    confirm_message: "Trigger and analyse one frame now?"

  - key: "align_once"
    label: "Align once"
    description: "Align the beam to the current target cricle."
    confirm_title: "Align once"
    confirm_message: "Align once?"

  - key: "pick_up"
    label: "Pick up"
    description: "Pick up lens"
    confirm_title: "Pick up"
    confirm_message: "Pick up lens?"

  - key: "drop_off"
    label: "Drop off"
    description: "Drop off lens"
    confirm_title: "Drop off"
    confirm_message: "Drop off lens?"

  - key: "full_run_test"
    label: "full_run_test"
    description: "full_run_test"
    confirm_title: "full_run_test"
    confirm_message: "full_run_test?"